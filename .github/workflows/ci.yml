name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A new push to a PR cancels that PR's older run; main pushes each keep their own run (the release needs them).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 4 jobs, not 6: macOS runners are the scarce ones. macOS keeps 3.9 (the python3 Apple ships),
        # Ubuntu covers both ends, Windows runs current Python. ubuntu-latest (26.04) has no 3.9 build.
        include:
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: ubuntu-24.04, python: "3.12"}
          - {os: macos-latest, python: "3.9"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      # Test fixture repos have no .gitattributes; keep their bytes identical to POSIX runners.
      - run: git config --global core.autocrlf false
      - run: python scripts/release.py --check
      - run: python tests/run.py
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      # Different revisions must not cancel each other's pending release jobs.
      group: honey-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Version, test, tag and publish the tested main revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: python scripts/auto_release.py --expected-head "$EXPECTED_HEAD"
